---
################################################################################
#
#   Orderer Configuration
#
#   - This controls the type and configuration of the orderer.
#
################################################################################
General:
  # Listen address: The IP on which to bind to listen.
  ListenAddress: 127.0.0.1

  # Listen port: The port on which to bind to listen.
  ListenPort: 7050

  # TLS: TLS settings for the GRPC server.
  TLS:
    # Require server-side TLS
    Enabled: false
    # PrivateKey governs the file location of the private key of the TLS certificate.
    PrivateKey: tls/server.key
    # Certificate governs the file location of the server TLS certificate.
    Certificate: tls/server.crt
    # RootCAs contains a list of additional root certificates used for verifying certificates
    # of other orderer nodes during outbound connections.
    # It is not required to be set, but can be used to augment the set of TLS CA certificates
    # available from the MSPs of each channel’s configuration.
    RootCAs:
      - tls/ca.crt
    # Require client certificates / mutual TLS for inbound connections.
    ClientAuthRequired: false
    # If mutual TLS is enabled, ClientRootCAs contains a list of additional root certificates
    # used for verifying certificates of client connections.
    # It is not required to be set, but can be used to augment the set of TLS CA certificates
    # available from the MSPs of each channel’s configuration.
    ClientRootCAs:
  # Keepalive settings for the GRPC server.
  Keepalive:
    # ServerMinInterval is the minimum permitted time between client pings.
    # If clients send pings more frequently, the server will
    # disconnect them.
    ServerMinInterval: 60s
    # ServerInterval is the time between pings to clients.
    ServerInterval: 7200s
    # ServerTimeout is the duration the server waits for a response from
    # a client before closing the connection.
    ServerTimeout: 20s
  # Config defines the configuration options for backoff GRPC client.
  Backoff:
    # BaseDelay is the amount of time to backoff after the first failure.
    BaseDelay: 1s
    # Multiplier is the factor with which to multiply backoffs after a
    # failed retry. Should ideally be greater than 1.
    Multiplier: 1.6
    # MaxDelay is the upper bound of backoff delay.
    MaxDelay: 2m

  # Since all nodes should be consistent it is recommended to keep
  # the default value of 100MB for MaxRecvMsgSize & MaxSendMsgSize
  # Max message size in bytes the GRPC server and client can receive
  MaxRecvMsgSize: 104857600
  # Max message size in bytes the GRPC server and client can send
  MaxSendMsgSize: 104857600
  # Throttling prevents clients from sending too many transactions
  # per second to the broadcast API of this node.
  # It is only enforced when the Rate is non-zero, and when the client
  # connects using mutual TLS.
  # The effective rate of transactions is divided across all clients
  # and organizations at a given unit of time governed by the inactivity timeout.
  # When a client's rate of transaction submission exhausts its allocated budget,
  # it is throttled until additional "budget" is allocated (it is allocated once per second).
  Throttling:
    # Rate is the maximum rate (transactions per second) for all clients combined.
    # A zero rate disables throttling.
    Rate: 0
    # InactivityTimeout defines the time frame after which
    # inactive clients are pruned from memory and are not considered
    # when allocating the budget for throttling per client.
    InactivityTimeout: 5s

  # Limits defines resource limits for the services exposed by the orderer.
  Limits:
    # DeliverSeekTimeout is the maximum time the orderer waits for a seek
    # request on a deliver stream before closing it - both before the
    # first seek and between completed deliveries - so idle streams cannot
    # hold handler goroutines forever. A stream being served (delivering
    # blocks, or waiting at the chain tip) is unaffected. When the
    # property is missing or the value is 0, the default of 30s is
    # applied. Any negative value disables the timeout.
    DeliverSeekTimeout: 30s
    # Concurrency limits the number of concurrent requests per service.
    # Each budget is independent and finite unless set to -1 (unlimited).
    # A stream consumes an authenticated budget only after its seek
    # request passes the channel policy check and only while the seek is
    # being served, so idle connections cannot exhaust it. When a
    # property is missing or the value is 0, the documented default is
    # applied. The budgets are global with no per-identity or per-channel
    # fairness: one authorized reader can occupy all of a budget's slots.
    # Operators should alert on the deliver_sessions_rejected metric
    # (labeled by budget, e.g. rate(deliver_sessions_rejected[5m]) > 0)
    # and size up or isolate heavy tenants accordingly.
    Concurrency:
      # DeliverPreAuth limits concurrent deliver streams whose handler is
      # still waiting for the first seek request, bounding the goroutine
      # and connection-state cost of clients that connect but never seek.
      # Such a stream holds only this budget (until the first seek is
      # admitted, or the stream ends or hits DeliverSeekTimeout), never
      # the authenticated budgets. The default of 500 covers connection
      # churn; each stream costs only a goroutine. Set to -1 for no
      # limit.
      DeliverPreAuth: 500
      # DeliverService limits concurrent deliver sessions serving full
      # blocks to channel readers; this is the memory-critical budget.
      # A serving stream retains roughly 2.5x the block size when
      # consumers are slow: about 5 MB at the sample PreferredMaxBytes
      # (2 MB, the size blocks are typically cut to) and about 25 MB at
      # AbsoluteMaxBytes (10 MB, the hard ceiling). Two constraints pull
      # in opposite directions and must BOTH be satisfied:
      #   memory:  limit x 2.5 x AbsoluteMaxBytes <= memory budget.
      #            The default of 80 keeps slow-drained clients within
      #            roughly 2 GiB at the 10 MiB sample AbsoluteMaxBytes.
      #   fan-out: limit >= (peers x channels) / orderers, with headroom.
      #            Example: 50 peers x 10 channels on 5 orderers needs
      #            100, which exceeds the default and would require
      #            roughly 2.5 GiB of worst-case retention - raise the
      #            limit and the memory budget together, or add orderers.
      # Set to -1 for no limit.
      DeliverService: 80
      # DeliverHeaderService limits concurrent deliver sessions serving
      # only block headers (SeekInfo HEADER_WITH_SIG), which the BFT
      # censorship monitor opens at one long-lived stream per channel to
      # every orderer but its block source, so the legitimate fan-out is
      # the full peers x channels, not divided by orderers. Header
      # streams retain only about 64 KB each, so this budget can be
      # generous; the default of 1000 covers a 50 x 10 deployment with
      # 2x headroom for reconnects and retains about 64 MB worst case.
      # Exception: config blocks are delivered in full even to header
      # streams (the censorship monitor tracks configuration with them),
      # and a stream parked on a config block is charged to the
      # DeliverService budget instead, so large config blocks cannot
      # bypass the memory bound. Set to -1 for no limit.
      DeliverHeaderService: 1000
      # ClusterReplication limits concurrent deliver sessions serving
      # orderer-to-orderer block replication, identified by the channel's
      # consenter client TLS certificate (and the /Channel/Orderer/Readers
      # policy). This budget is reserved: client floods can never draw
      # from it, so replication stays alive even when the client budgets
      # are exhausted. Classification works whenever the pulling orderer
      # presents a consenter client certificate, which requires TLS to be
      # enabled and, when a separate cluster listener is configured,
      # General.Cluster.ClientCertificate to be set; otherwise pulls fall
      # back to the client budgets (a startup warning is logged in both
      # cases). The default of -1 (no limit) keeps existing deployments
      # unaffected; set it to (orderers - 1) x channels served, plus
      # headroom for concurrent catch-up probes, to bound a compromised
      # consenter - note that a Byzantine consenter is out of scope
      # regardless, since it can halt consensus directly.
      ClusterReplication: -1

  # Cluster settings for ordering service nodes that communicate with other ordering service nodes
  # such as Raft based ordering service.
  Cluster:
    # SendBufferSize is the maximum number of messages in the egress buffer.
    # Consensus messages are dropped if the buffer is full, and transaction
    # messages are waiting for space to be freed.
    SendBufferSize: 100

    # ClientCertificate governs the file location of the client TLS certificate
    # used to establish mutual TLS connections with other ordering service nodes.
    # If not set, the server General.TLS.Certificate is re-used.
    ClientCertificate:
    # ClientPrivateKey governs the file location of the private key of the client TLS certificate.
    # If not set, the server General.TLS.PrivateKey is re-used.
    ClientPrivateKey:

    # The below 4 properties should be either set together, or be unset together.
    # If they are set, then the orderer node uses a separate listener for intra-cluster
    # communication. If they are unset, then the general orderer listener is used.
    # This is useful if you want to use a different TLS server certificates on the
    # client-facing and the intra-cluster listeners.

    # ListenPort defines the port on which the cluster listens to connections.
    ListenPort:
    # ListenAddress defines the IP on which to listen to intra-cluster communication.
    ListenAddress:
    # ServerCertificate defines the file location of the server TLS certificate used for intra-cluster
    # communication.
    ServerCertificate:
    # ServerPrivateKey defines the file location of the private key of the TLS certificate.
    ServerPrivateKey:

    # ReplicationPolicy defines how blocks are replicated between orderers.
    # Permitted values:
    # in BFT: "simple" | "consensus" (default);
    # in etcdraft: ignored, (always "simple", regardless of value in config).
    # When running a Raft orderer or with ReplicationPolicy set to 'simple', an orderer
    # replicates blocks from a single orderer node.
    # When running a BFT orderer with ReplicationPolicy set to 'consensus', the orderer
    # replicates blocks from a single orderer node, but replicates block headers with signatures
    # from other orderer nodes, and if it suspects the former node withholds blocks from it,
    # it switches to a new orderer as a source of blocks.
    ReplicationPolicy:

  # LocalMSPDir is where to find the private crypto material needed by the
  # orderer. It is set relative here as a default for dev environments but
  # should be changed to the real location in production.
  LocalMSPDir: msp

  # LocalMSPID is the identity to register the local MSP material with the MSP
  # manager. The sample organization defined in the
  # sample configuration provided has an MSP ID of "SampleOrg".
  LocalMSPID: SampleOrg

  # Enable an HTTP service for Go "pprof" profiling as documented at:
  # https://golang.org/pkg/net/http/pprof
  Profile:
    Enabled: false
    Address: 0.0.0.0:6060

  # BCCSP configures the blockchain crypto service providers.
  BCCSP:
    # Default specifies the preferred blockchain crypto service provider
    # to use. If the preferred provider is not available, the software
    # based provider ("SW") will be used.
    # Valid providers are:
    #  - SW: a software based crypto provider
    #  - PKCS11: a CA hardware security module crypto provider.
    Default: SW

    # SW configures the software based blockchain crypto provider.
    SW:
      # TODO: The default Hash and Security level needs refactoring to be
      # fully configurable. Changing these defaults requires coordination
      # SHA2 is hardcoded in several places, not only BCCSP
      Hash: SHA2
      Security: 256
      # Location of key store. If this is unset, a location will be
      # chosen using: 'LocalMSPDir'/keystore
      FileKeyStore:
        KeyStore:

    # Settings for the PKCS#11 crypto provider (i.e. when DEFAULT: PKCS11)
    PKCS11:
      # Location of the PKCS11 module library
      Library:
      # Token Label
      Label:
      # User PIN
      Pin:
      Hash:
      Security:
      FileKeyStore:
        KeyStore:

  # Authentication contains configuration parameters related to authenticating
  # client messages
  Authentication:
    # the acceptable difference between the current server time and the
    # client's time as specified in a client request message
    TimeWindow: 15m

################################################################################
#
#   SECTION: File Ledger
#
#   - This section applies to the configuration of the file ledger.
#
################################################################################
FileLedger:
  # Location: The directory to store the blocks in.
  Location: /var/hyperledger/production/orderer

################################################################################
#
#   Debug Configuration
#
#   - This controls the debugging options for the orderer
#
################################################################################
Debug:
  # BroadcastTraceDir when set will cause each request to the Broadcast service
  # for this orderer to be written to a file in this directory
  BroadcastTraceDir:

  # DeliverTraceDir when set will cause each request to the Deliver service
  # for this orderer to be written to a file in this directory
  DeliverTraceDir:

################################################################################
#
#   Operations Configuration
#
#   - This configures the operations server endpoint for the orderer
#
################################################################################
Operations:
  # host and port for the operations server
  ListenAddress: 127.0.0.1:8443

  # TLS configuration for the operations endpoint
  TLS:
    # TLS enabled
    Enabled: false

    # Certificate is the location of the PEM encoded TLS certificate
    Certificate:

    # PrivateKey points to the location of the PEM-encoded key
    PrivateKey:

    # Most operations service endpoints require client authentication when TLS
    # is enabled. ClientAuthRequired requires client certificate authentication
    # at the TLS layer to access all resources.
    ClientAuthRequired: false

    # Paths to PEM encoded ca certificates to trust for client authentication
    ClientRootCAs: []

################################################################################
#
#   Metrics Configuration
#
#   - This configures metrics collection for the orderer
#
################################################################################
Metrics:
  # The metrics provider is one of statsd, prometheus, or disabled
  Provider: disabled

  # The statsd configuration
  Statsd:
    # network type: tcp or udp
    Network: udp

    # the statsd server address
    Address: 127.0.0.1:8125

    # The interval at which locally cached counters and gauges are pushed
    # to statsd; timings are pushed immediately
    WriteInterval: 30s

    # The prefix is prepended to all emitted statsd metrics
    Prefix:

################################################################################
#
#   Admin Configuration
#
#   - This configures the admin server endpoint for the orderer
#
################################################################################
Admin:
  # host and port for the admin server
  ListenAddress: 127.0.0.1:9443

  # TLS configuration for the admin endpoint
  TLS:
    # TLS enabled
    Enabled: false

    # Certificate is the location of the PEM encoded TLS certificate
    Certificate:

    # PrivateKey points to the location of the PEM-encoded key
    PrivateKey:

    # Most admin service endpoints require client authentication when TLS
    # is enabled. ClientAuthRequired requires client certificate authentication
    # at the TLS layer to access all resources.
    #
    # NOTE: When TLS is enabled, the admin endpoint requires mutual TLS. The
    # orderer will panic on startup if this value is set to false.
    ClientAuthRequired: true

    # Paths to PEM encoded ca certificates to trust for client authentication
    ClientRootCAs: []

################################################################################
#
#   Channel participation API Configuration
#
#   - This provides the channel participation API configuration for the orderer.
#   - Channel participation uses the ListenAddress and TLS settings of the Admin
#     service.
#
################################################################################
ChannelParticipation:
  # Channel participation API is enabled. Deprecated: must be set to true.
  Enabled: true

  # The maximum size of the request body when joining a channel.
  MaxRequestBodySize: 1 MB

################################################################################
#
#   Consensus Configuration
#
#   - This section contains config options for a consensus plugin. It is opaque
#     to orderer, and completely up to consensus implementation to make use of.
#
################################################################################
Consensus:
  # The allowed key-value pairs here depend on consensus plugin. For etcd/raft,
  # we use following options:

  # WALDir specifies the location at which Write Ahead Logs for etcd/raft are
  # stored. Each channel will have its own subdir named after channel ID.
  WALDir: /var/hyperledger/production/orderer/etcdraft/wal

  # SnapDir specifies the location at which snapshots for etcd/raft are
  # stored. Each channel will have its own subdir named after channel ID.
  SnapDir: /var/hyperledger/production/orderer/etcdraft/snapshot
