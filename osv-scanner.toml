# Configuration for the OSV scanner run by .github/workflows/vulnerability-scan.yml.
# See https://google.github.io/osv-scanner/configuration/

# GO-2026-5932 advises against golang.org/x/crypto/openpgp, which is unmaintained
# and unsafe by design. It applies to every version of golang.org/x/crypto and has
# no fixed version, so it cannot be resolved by upgrading.
#
# Fabric does not use the openpgp packages. golang.org/x/crypto is pulled in
# transitively for blake2b:
#
#   github.com/hyperledger/fabric/msp -> github.com/IBM/idemix -> .../bccsp
#     -> github.com/hyperledger/aries-bbs-go/bbs -> golang.org/x/crypto/blake2b
#
# The scan runs against go.mod as a lockfile, which reports every module in the
# dependency graph without reachability analysis, so the unused openpgp packages
# get flagged anyway.
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained and has no fix; Fabric only uses x/crypto for blake2b. See comment above."
